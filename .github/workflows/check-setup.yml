name: Check setup

# Run this from the Actions tab after setting up (and any time you change club.yml).
# It tests your Play-Cricket and Meta connections and opens an issue showing
# sample graphics in your club's colours. Nothing is posted.
on:
  workflow_dispatch:
  push:
    paths: [club.yml, "assets/**", "my-templates/**"]

permissions:
  contents: write
  issues: write

concurrency:
  group: cricket-social-kit
  cancel-in-progress: false

jobs:
  check:
    # Only runs in clubs' own copies, not in the template itself.
    if: github.repository != 'verwoodcc-social/cricket-social-kit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PHOTOS_KEY: ${{ secrets.PLAYER_PHOTOS_TOKEN }}   # empty if no photo store is connected
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        timeout-minutes: 10
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          # The runner usually has everything Chromium needs. Only fetch system packages if it won't start
          # (Ubuntu's package mirror is sometimes very slow, so this avoids it when possible).
          python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); p.chromium.launch().close(); p.stop()" \
            || timeout 420 python -m playwright install-deps chromium
          fc-list | grep -qi emoji || timeout 180 sudo apt-get install -y -q fonts-noto-color-emoji || true

      - name: Get player photos from the private photo store (if connected)
        if: env.PHOTOS_KEY != ''
        continue-on-error: true   # a photo problem must never stop the posts
        uses: actions/checkout@v4
        with:
          repository: verwoodcc-social/verwood-player-photos
          token: ${{ secrets.PLAYER_PHOTOS_TOKEN }}
          path: player-photos   # git-ignored: photos are only drawn into graphics, never saved here

      - name: Get photos from the SharePoint photo store
        continue-on-error: true   # a photo problem must never stop the posts
        env:
          M365_TENANT_ID: ${{ secrets.M365_TENANT_ID }}
          M365_CLIENT_ID: ${{ secrets.M365_CLIENT_ID }}
          M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: |
          [ -d player-photos/.git ] && python -m kit photos import   # one-off: copy the old GitHub photos across
          python -m kit photos folders   # makes a folder for any team added to club.yml → photo_store → teams
          python -m kit photos sync

      - name: Check settings and connections, make sample graphics
        id: check
        env:
          PLAYCRICKET_API_TOKEN: ${{ secrets.PLAYCRICKET_API_TOKEN }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}   # only to see if email is set up (for the expiry check)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m kit check
        continue-on-error: true

      - name: Save the sample graphics
        if: hashFiles('.kit-pending.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/samples
          git diff --cached --quiet || git commit -m "Sample graphics"
          git pull --rebase --quiet && git push --quiet

      - name: Open a preview issue
        if: hashFiles('.kit-pending.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m kit preview --sha "$(git rev-parse HEAD)"

      - name: Result
        if: steps.check.outcome == 'failure'
        run: |
          echo "Some checks failed. Open this run's Summary to see what to fix."
          exit 1
