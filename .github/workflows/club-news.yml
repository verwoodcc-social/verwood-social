name: Club news

# Runs when someone submits or edits the "Club news or event" form (an issue labelled club-news).
# Only people with access to this repository count: anyone else's form is ignored.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: news-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  news:
    if: >-
      contains(github.event.issue.labels.*.name, 'club-news') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PHOTOS_KEY: ${{ secrets.PLAYER_PHOTOS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        timeout-minutes: 10
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          # The runner usually has everything Chromium needs. Only fetch system packages if it won't start
          # (Ubuntu's package mirror is sometimes very slow, so this avoids it when possible).
          python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); p.chromium.launch().close(); p.stop()" \
            || timeout 420 python -m playwright install-deps chromium
          fc-list | grep -qi emoji || timeout 180 sudo apt-get install -y -q fonts-noto-color-emoji || true

      - name: Get club photos from the private photo store (if connected)
        if: env.PHOTOS_KEY != ''
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: verwoodcc-social/verwood-player-photos
          token: ${{ secrets.PLAYER_PHOTOS_TOKEN }}
          path: player-photos

      - name: Get photos from the SharePoint photo store
        continue-on-error: true   # a photo problem must never stop the posts
        env:
          M365_TENANT_ID: ${{ secrets.M365_TENANT_ID }}
          M365_CLIENT_ID: ${{ secrets.M365_CLIENT_ID }}
          M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: python -m kit photos sync

      - name: Make the graphic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m kit news --issue ${{ github.event.issue.number }}

      - name: Save the images to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts state
          git diff --cached --quiet || git commit -m "Club news images (#${{ github.event.issue.number }})"
          git pull --rebase --quiet && git push --quiet

      - name: Open the preview for approval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python -m kit announce --sha "$(git rev-parse HEAD)"

      - name: Remember the preview
        if: always()
        run: |
          git add state
          git diff --cached --quiet || (git commit -m "Update posted list" && git pull --rebase --quiet && git push --quiet)

      - name: Email the committee if something went wrong
        if: failure()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          M365_TENANT_ID: ${{ secrets.M365_TENANT_ID }}
          M365_CLIENT_ID: ${{ secrets.M365_CLIENT_ID }}
          M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_KEY: "club-news:${{ github.event.issue.number }}"
          ALERT_TITLE: "A club news preview couldn't be made"
        run: python -m kit alert --key "$ALERT_KEY" --title "$ALERT_TITLE" --link "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"None

      - name: Clear any earlier problem now it's working
        if: success()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          M365_TENANT_ID: ${{ secrets.M365_TENANT_ID }}
          M365_CLIENT_ID: ${{ secrets.M365_CLIENT_ID }}
          M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_KEY: "club-news:${{ github.event.issue.number }}"
        run: python -m kit resolved --key "$ALERT_KEY"
