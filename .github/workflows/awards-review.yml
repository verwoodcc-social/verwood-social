name: Awards review

# Shows who would have won Player of the Week and Player of the Month in a past season. Posts nothing:
# the results are on the run's summary page.
on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season (year)"
        type: string
        default: "2026"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Work out the winners
        env:
          PLAYCRICKET_API_TOKEN: ${{ secrets.PLAYCRICKET_API_TOKEN }}
          SEASON: ${{ inputs.season }}
        run: python -m kit awards-review --season "$SEASON"
