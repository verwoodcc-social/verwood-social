name: Sponsor report

# On the 1st of each month: last month's Facebook and Instagram figures as a PDF for the sponsor,
# opened as an issue. Nothing is posted publicly. Run it by hand for any month from the Actions tab.
on:
  schedule:
    - cron: "41 7 1 * *"   # 07:41 UTC on the 1st
  workflow_dispatch:
    inputs:
      month:
        description: "Month as YYYY-MM (leave empty for last month)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: sponsor-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        timeout-minutes: 8
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Read the figures from Meta and make the PDF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          MONTH: ${{ inputs.month }}
        run: python -m kit report ${MONTH:+--month "$MONTH"}

      - name: Save the report to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts state
          git diff --cached --quiet || git commit -m "Sponsor report"
          git pull --rebase --quiet && git push --quiet

      - name: Open the report issue and email it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          M365_TENANT_ID: ${{ secrets.M365_TENANT_ID }}
          M365_CLIENT_ID: ${{ secrets.M365_CLIENT_ID }}
          M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: python -m kit report-issue --sha "$(git rev-parse HEAD)"
