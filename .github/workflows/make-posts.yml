name: Make posts

# Runs every morning. Makes the match posts every day, the fixtures post on your
# fixtures day and the results round-up on your round-up day (set in club.yml).
on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC (06:17 in UK winter, 07:17 in summer). GitHub can start it a little late.
    - cron: "17 8 * * *"   # a second try, in case Play-Cricket was briefly unavailable. Nothing is posted twice.
    - cron: "1 9 * * *"    # posting runs: posts wait until 10:00 UK (club.yml → posts → post_from), so in summer
    - cron: "1 10 * * *"   #   the 09:01 UTC run posts them and in winter the 10:01 UTC one does
    - cron: "47 11 * * *"  # midday and afternoon checks for games called off (game off story only)
    - cron: "47 13 * * *"
    - cron: "17 16 * * *"
  issues:
    types: [opened]        # a captain's report arrived (from the Microsoft Form): its result goes out (from 10:00)
  workflow_dispatch:
    inputs:
      only:
        description: "Which posts to make now"
        type: choice
        options: [all-due, fixtures, roundup, matches, matchday, game-off, throwback, countdown, leaderboards, tables, season, season-fixtures]
        default: all-due
      date:
        description: "Catch up a missed day: run as if it were this date (YYYY-MM-DD). Leave empty for today."
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: cricket-social-kit
  cancel-in-progress: false

jobs:
  make:
    # Only runs in clubs' own copies, not in the template itself.
    if: >-
      github.repository != 'verwoodcc-social/cricket-social-kit' &&
      (github.event_name != 'issues' || startsWith(github.event.issue.title, 'Captain'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        timeout-minutes: 10
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          # The runner usually has everything Chromium needs. Only fetch system packages if it won't start
          # (Ubuntu's package mirror is sometimes very slow, so this avoids it when possible).
          python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); p.chromium.launch().close(); p.stop()" \
            || timeout 420 python -m playwright install-deps chromium
          fc-list | grep -qi emoji || timeout 180 sudo apt-get install -y -q fonts-noto-color-emoji || true

      - name: Get photos from the SharePoint photo store
        continue-on-error: true   # a photo problem must never stop the posts
        env:
          M365_TENANT_ID: ${{ secrets.M365_TENANT_ID }}
          M365_CLIENT_ID: ${{ secrets.M365_CLIENT_ID }}
          M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: python -m kit photos sync

      - name: Read Play-Cricket and make the graphics
        env:
          PLAYCRICKET_API_TOKEN: ${{ secrets.PLAYCRICKET_API_TOKEN }}
          KIT_ONLY: ${{ github.event_name == 'issues' && 'matches' || (github.event.schedule == '47 11 * * *' || github.event.schedule == '47 13 * * *' || github.event.schedule == '17 16 * * *') && 'game-off' || inputs.only }}
          KIT_TODAY: ${{ inputs.date }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m kit make

      - name: Save the images to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +%FT%TZ > state/last_run.txt   # keeps the schedule active out of season
          git add posts state
          git diff --cached --quiet || git commit -m "Post images $(date -u +%F)"
          git pull --rebase --quiet && git push --quiet

      - name: Open approval issues (or post, if approval is automatic)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          KIT_POST_NOW: ${{ github.event_name == 'workflow_dispatch' }}
        run: python -m kit announce --sha "$(git rev-parse HEAD)"

      - name: Post scheduled club news and today's event reminders
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python -m kit due

      - name: Remind the committee before a key expires
        if: always()
        continue-on-error: true   # a reminder problem must never stop the posts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          M365_TENANT_ID: ${{ secrets.M365_TENANT_ID }}
          M365_CLIENT_ID: ${{ secrets.M365_CLIENT_ID }}
          M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python -m kit expiry

      - name: Email the committee about new photos waiting in To check
        if: always()
        continue-on-error: true
        env:
          M365_TENANT_ID: ${{ secrets.M365_TENANT_ID }}
          M365_CLIENT_ID: ${{ secrets.M365_CLIENT_ID }}
          M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: python -m kit photos notify

      - name: Remember what's been posted
        if: always()
        run: |
          git add state
          git diff --cached --quiet || (git commit -m "Update posted list" && git pull --rebase --quiet && git push --quiet)

      - name: Email the committee if something went wrong
        if: failure()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          M365_TENANT_ID: ${{ secrets.M365_TENANT_ID }}
          M365_CLIENT_ID: ${{ secrets.M365_CLIENT_ID }}
          M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_KEY: "make-posts"
          ALERT_TITLE: "The daily posts didn't run"
        run: python -m kit alert --key "$ALERT_KEY" --title "$ALERT_TITLE" --link "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --quiet-first

      - name: Clear any earlier problem now it's working
        if: success()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          M365_TENANT_ID: ${{ secrets.M365_TENANT_ID }}
          M365_CLIENT_ID: ${{ secrets.M365_CLIENT_ID }}
          M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_KEY: "make-posts"
        run: python -m kit resolved --key "$ALERT_KEY"
