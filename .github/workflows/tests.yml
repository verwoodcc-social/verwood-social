name: Tests

on:
  push:
    paths: ["kit/**", "tests/**", "requirements.txt"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Only needed in the template repository.
    if: github.repository == 'verwoodcc-social/cricket-social-kit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
