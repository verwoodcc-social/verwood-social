# Verwood Cricket Club settings. Edit and commit to change how posts look or when they go out.
# After saving, a Preview issue appears in the Issues tab showing how the graphics look.
club:
  name: "Verwood Cricket Club"
  short_name: "Verwood"
  play_cricket_site_id: 8472
  play_cricket_name: "Verwood CC"
  website: "verwood.play-cricket.com"
  handle: "@verwoodcc"
  hashtags: "#VerwoodCC #CricketDorset #ClubCricket"
  timezone: "Europe/London"

branding:
  badge: "assets/verwood-badge.svg"
  primary_colour: "#1A4192"
  accent_colour: "#DBE2EA"

  # ---- Optional pictures (see assets/HOW-TO-UPLOAD.md) -----------------------
  # Upload the picture to the assets folder first, then put "assets/" and its
  # exact file name in the quotes. Leave as "" for none.
  background_image: ""             # e.g. "assets/potterne-park.jpg"
  fixtures_background: ""          # optional: a different photo per post type
  results_background: ""
  match_background: ""
  background_darkness: medium      # light, medium or strong (strong for busy photos)

  sponsor_logo: "assets/struan-logo.jpg"
  sponsor_text: "Struan"
  sponsor_label: "Supported by"
  sponsor_in_captions: true        # true = also add "Supported by …" to captions

# ---- Words on the graphics and captions ----------------------------------------
wording:
  fixtures_title: "This Week's Fixtures"
  results_title: "Last Week's Results"
  win: "Victory"
  loss: "Defeat"
  draw: "Draw"
  tie: "Tied"
  abandoned: "Abandoned"
  cancelled: "Cancelled"
  no_result: "No result"
  fixtures_sign_off: "Come down and support! 🏏"
  story_cta: "Full details on our page"   # the button-style line at the bottom of each story

# ---- Milestone posts: a post of their own for 50s, 100s and five-wicket hauls ----
milestones:
  enabled: true
  batting: [50, 100]           # runs that count as a milestone
  bowling_wickets: 5           # wickets in an innings
  # ECB guidance: a junior's photo and name must never appear together.
  #   name_no_photo = juniors are named ("Ben T.") but their photo isn't used (recommended)
  #   photo_no_name = juniors' photos are used, with no name on the graphic or caption
  junior_photos: name_no_photo

# ---- Show or hide (true = show, false = hide) ----------------------------------
show:
  top_performers: true
  toss: true
  ground_on_fixtures: false
  handle_and_website: true

posts:
  fixtures: {enabled: true, day: friday}
  results_roundup: {enabled: true, day: monday}
  match_results: {enabled: true, lookback_days: 1}
  approval: automatic   # review = wait for the approved label; automatic = post straight away
  # Also post a tall version to Instagram and Facebook Stories (after the normal post).
  stories:
    enabled: true
    for: [match, fixtures, roundup]   # any of: match, fixtures, roundup
  networks: [facebook, instagram]

juniors:
  # How players' names appear: initial = "Ben T.", first = "Ben", full, or none
  names: initial
  # true = use that for every team (juniors often play in adult and women's sides)
  apply_to_all_teams: true
