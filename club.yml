# Verwood Cricket Club settings. Edit and commit to change how posts look or when they go out.
# After saving, a Preview issue appears in the Issues tab showing how the graphics look.
club:
  name: "Verwood Cricket Club"
  short_name: "Verwood"
  play_cricket_site_id: 8472
  play_cricket_name: "Verwood CC"
  website: "verwood.play-cricket.com"
  handle: "@verwoodcc"
  hashtags: "#VerwoodCC #CricketDorset #ClubCricket"
  timezone: "Europe/London"

branding:
  badge: "assets/verwood-badge.svg"
  primary_colour: "#1A4192"
  accent_colour: "#DBE2EA"

  # ---- Optional pictures (see assets/HOW-TO-UPLOAD.md) -----------------------
  # Upload the picture to the assets folder first, then put "assets/" and its
  # exact file name in the quotes. Leave as "" for none.
  background_image: ""             # e.g. "assets/potterne-park.jpg"
  fixtures_background: ""          # optional: a different photo per post type
  results_background: ""
  match_background: ""
  background_darkness: medium      # light, medium or strong (strong for busy photos)

  sponsor_logo: "assets/struan-logo.jpg"
  sponsor_text: "Struan"
  sponsor_label: "Supported by"
  sponsor_in_captions: true        # true = also add "Supported by …" to captions

# ---- Words on the graphics and captions ----------------------------------------
wording:
  fixtures_title: "This Week's Fixtures"
  results_title: "Last Week's Results"
  win: "Victory"
  loss: "Defeat"
  draw: "Draw"
  tie: "Tied"
  abandoned: "Abandoned"
  cancelled: "Cancelled"
  no_result: "No result"
  fixtures_sign_off: "Come down and support! 🏏"
  story_cta: "Full details on our page"   # the button-style line at the bottom of each story

# ---- Milestone posts: a post of their own for 50s, 100s and five-wicket hauls ----
milestones:
  enabled: true
  batting: [50, 100]           # runs that count as a milestone
  bowling_wickets: 5           # wickets in an innings
  # ECB guidance: a junior's photo and name must never appear together.
  #   name_no_photo = juniors are named ("Ben T.") but their photo isn't used (recommended)
  #   photo_no_name = juniors' photos are used, with no name on the graphic or caption
  junior_photos: name_no_photo

# ---- Show or hide (true = show, false = hide) ----------------------------------
show:
  result_word: false        # false = no Victory / Defeat word on result graphics, just who won and the scores
  top_performers: true
  toss: true
  ground_on_fixtures: false
  handle_and_website: true

posts:
  fixtures: {enabled: true, day: friday}
  results_roundup: {enabled: true, day: monday}
  match_results: {enabled: true, lookback_days: 1}
  approval: automatic   # review = wait for the approved label; automatic = post straight away
  # Also post a tall version to Instagram and Facebook Stories (after the normal post).
  stories:
    enabled: true
    for: [match, fixtures, roundup, news, watch, throwback, countdown, award]   # any of: match, fixtures, roundup, news, watch, leaderboards
  networks: [facebook, instagram]
  # Feed posts made earlier in the morning wait until this time (UK) to go out: Facebook is busiest from
  # 10:00 to 12:00 (Metricool, November 2026). Stories-only posts (Today, Game off) and runs started by hand go
  # straight away. "" = post as soon as they're made.
  post_from: "10:00"

juniors:
  # How players' names appear: initial = "Ben T.", first = "Ben", full, or none
  names: initial
  # true = use that for every team (juniors often play in adult and women's sides)
  apply_to_all_teams: true
  # Which teams count as junior (kept out of matchday stories). Verwood's Daughters and Sons sides are junior.
  team_pattern: '\b(U\s?\d{1,2}[A-Z]?|Under\s?\d{1,2}|Girls|Boys|Juniors?|All Stars|Dynamos|Colts|Daughters|Sons)\b'

# Career milestones: 500 runs (then every 500); 50 wickets, matches, catches and keeping catches (then every 50).
# Saturday, midweek and Sunday sides start from the CricketStatz totals in careers/baseline.csv (to the end
# of 2026), then add Play-Cricket. Women's Softball uses Play-Cricket only. Outdoor summer games only.
career_milestones:
  enabled: true
  names: full               # career milestones always use full names (a junior's photo is never shown with it)
  baseline_until: 2026
  club_teams: '^(1st|2nd|3rd|4th|5th) XI$|^Wednesday 1st XI$|^Friendly XI$'
  softball_teams: "^Women's Softball( B)?$"
  softball_history_from: 2015
  every:
    runs: 500
    wickets: 50
    matches: 50
    catches: 50
    keeper_catches: 50
  # Milestone watch: posted with Friday's fixtures, for players whose team plays that week and who
  # are this close to their next milestone (and have played in the last 3 weeks)
  watch:
    enabled: true
    runs: 50
    wickets: 3
    matches: 1
    catches: 2
    keeper_catches: 2
    active_days: 21
    max: 8

# Captain's match reports (Microsoft Form -> Power Automate -> GitHub; see docs/CAPTAINS-REPORT-SETUP.md).
# A report is added to the result post's caption. Adult results wait until wait_until (UK time) for one.
captain_reports:
  enabled: true
  wait: true
  wait_until: "09:55"     # just before posts go out at 10:00
  max_length: 700           # characters of report used in the caption
  teams: '.'                # which teams' results wait for a report: all teams (senior and youth)

# Weekly backup (Sunday): the kit, as one file holding every file and its history, saved to the club
# SharePoint. The newest `keep` weeks are kept; older ones go to the recycle bin.
# Restoring: docs/BACKUP-SETUP.md.
backup:
  enabled: true
  site: verwoodcc.sharepoint.com/sites/VerwoodCCClubDocuments
  folder: Social media kit backups
  keep: 8

# Word copies of the kit's documents: Markdown saved in <folder>/Markdown on the club SharePoint is turned
# into Word documents in <folder> (Actions → Word documents, daily and on demand).
word_docs:
  enabled: true
  site: verwoodcc.sharepoint.com/sites/VerwoodCCClubDocuments
  folder: Social media kit documents

# Expiry reminders: an email (and a problem issue) before a key the kit uses runs out, at each of
# warn_days before. The Meta token and photos key dates are read automatically; Microsoft doesn't share
# the email secret's date, so copy it from Entra → App registrations → Certificates & secrets.
expiry_reminders:
  enabled: true
  warn_days: [30, 7]
  m365_secret_expires: "2028-11-05"   # the "VCC Social" secret in Entra; update this when you make a new one

# Season fixture lists: 1–7 April, one post per team (senior and youth) with all its outdoor summer
# fixtures, spread across the week so a few go out each morning.
season_fixtures:
  enabled: true
  month: 4
  first_day: 1
  days: 7
  exclude: '\bIndoor\b'

# Season review: first Monday of October. One carousel: the club's season, a slide per adult team
# (record, league position, top 3 batters, bowlers and catchers), career milestones reached that
# season and the all-time career leaders.
season_review:
  enabled: true
  month: 10
  day: monday
  top: 3
  min_matches: 3          # sides with fewer games (one-off XIs) are left out
  title: "Season review"

# League tables: last day of each month, April to September. One carousel with each adult team's league
# table from Play-Cricket (Verwood highlighted). Junior teams and indoor leagues are left out.
league_tables:
  enabled: true
  months: [4, 5, 6, 7, 8, 9]
  exclude: '\bIndoor\b'
  title: "League tables"

# Season leaderboards: first Monday of each month, May to October (season to date).
# A club-wide board for all adult teams, then one per adult team. Junior and indoor teams are left out.
leaderboards:
  enabled: true
  day: monday
  months: [5, 6, 7, 8, 9]  # October's is replaced by the season review
  season_start_month: 4     # April
  season_end_month: 9       # September
  exclude_teams: '\bIndoor\b'
  min_matches: 3            # a team needs this many games before it gets its own board
  top: 5
  title: "Season leaderboards"

# Club news and events, from the "Club news or event" form (Issues → New issue). Always previewed first.
news:
  enabled: true
  reminder: true          # a "Today" Story on the morning of an event
  reminder_title: "Today"

# Photo store: the club SharePoint (Club Documents → Documents → Social media photos). Before posts are
# made, the photos are copied in for drawing into the graphics; nothing is ever saved back or made public.
# teams: one folder each under match-photos, named exactly as on Play-Cricket (Teams page, active teams).
photo_store:
  source: sharepoint        # sharepoint, or github (the old verwood-player-photos repository)
  site: verwoodcc.sharepoint.com/sites/VerwoodCCClubDocuments
  folder: Social media photos
  teams:
    - "1st XI"
    - "2nd XI"
    - "3rd XI"
    - "4th XI"
