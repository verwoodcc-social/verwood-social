# Match photos as backgrounds, from the match-photos folders in the private photo store
match_photos:
  enabled: true
  use_for: [match, milestone, roundup, news, throwback, countdown, award]   # news only when the form has no photo attached

# Matchday: a "Today" story each morning listing that day's senior games, home and away
matchday:
  enabled: true
  include: all            # all = home and away, home = home games only
  juniors: false          # false = senior teams only
  # Outdoor season only: April to September, and never for indoor teams
  months: [4, 5, 6, 7, 8, 9]
  exclude_teams: '\bIndoor\b'
  # Shown for home games when Play-Cricket has no ground recorded (not for indoor games)
  default_home_ground: "Potterne Park"
  title: "Matchday"
  cta: "Come and support!"

# Photo-led results: when a photo from the game is in the team's own folder in the photo store (added on the day
# of the game or up to days_after later, e.g. emailed in and moved out of To check), the result goes out as that
# photo with the score in a banner. If it arrives after the result has gone out, a "From the game" post follows.
# No player names on the graphic; for junior teams none in the caption either.
photo_results:
  enabled: true
  days_after: 3
  follow_up: true
  photos_from: "2026-11-14"   # photos added before this (the bulk import) never lead a result

# Player of the Week (Tuesdays, for Monday to Sunday) and Player of the Month (the 1st, for last month), from the
# scorecards of every team, juniors included. Points: 1 a run, +15 for 50, +30 for 100; 20 a wicket (5 in pairs-style
# junior cricket), +20 for five in an innings; 10 a catch or stumping; +5 a win. Juniors are named as usual (first
# name and initial) and their photo is never used.
awards:
  enabled: true
  weekly: true
  monthly: true
  week_day: tuesday
  month_day: 1
  months: [5, 6, 7, 8]           # only games played May to August (the outdoor league season) count
  min_points: 50                 # no award in a week where nobody reaches this
  exclude_teams: ""
  points: {fifty: 15, hundred: 30, wicket: 20, wicket_low: 5, five_for: 20, catch: 10, win: 5}

# Countdown to the new season: posts on these days before the first outdoor senior game (read from the
# Play-Cricket fixtures, so nothing to set each year), from March. A club photo goes behind it when there is one.
countdown:
  enabled: true
  months: [3, 4]
  days: [49, 42, 35, 28, 21, 14, 7, 3, 1]   # weekly from 7 weeks out, then 3 days and the day before
  exclude_teams: '\bIndoor\b'
  title: "Countdown to {year}"
  cta: "Who's ready?"

# Evening Stories: the day's result Stories go out again in the evening, when Instagram is busiest
# (Metricool, November 2026: 17:00 to 20:00). Instagram only: Facebook is busiest in the morning.
evening_stories:
  enabled: true
  time: "18:00"
  networks: [instagram]
  kinds: [match, throwback]   # match results and Throwback Thursday

# Throwback Thursday: a standout game from a past season (a century, five-for, big or very close win, tie or big
# total), each week in winter, oldest first. Any team. The archive of standout games is built by Actions → Throwback archive.
throwback:
  enabled: true
  day: thursday
  months: [11, 12, 1, 2, 3]   # November to March
  first_season: 2016          # Play-Cricket has full scorecards from here on
  exclude_teams: ""
  title: "Throwback Thursday"
  question: "Were you there? Tell us in the comments!"

# Game off: a story when Play-Cricket shows a game as cancelled or abandoned (yesterday, today or tomorrow).
# Checked on every Make posts run, including the extra midday and afternoon checks. Each game is announced once.
game_off:
  enabled: true
  juniors: true           # junior games too (no player names are shown)
  exclude_teams: '\bIndoor\b'   # indoor games are left out
  lookahead_days: 1       # 1 = also tomorrow's games, when they're called off a day early
  feed: false             # false = Stories only; true = also a Facebook and Instagram feed post
  title: "Game off"
  cta: "See you next time!" # the button at the bottom of the story

# Monthly sponsor report email (addresses are GitHub secrets, not here, because this repository is public)
report:
  email_subject: "VCC Social Media Report – {month}"   # {month} becomes e.g. November 2026
